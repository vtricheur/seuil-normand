<style>
/* Layout : rail de navigation à gauche (barre d'onglets en bas sur téléphone), contenu au centre, fiche détaillée en panneau latéral */
:root {
  --bg: #eef0ec; --panel: #fbfbf9; --sunk: #f3f4f1; --line: #d9ddd7; --ink: #1f2b33; --ink-2: #56646c; --ink-3: #87939a;

  --s-new: #2f6db3; --s-new-bg: #e1ebf6; --s-call: #8a5a12; --s-call-bg: #f6ead6; --s-sent: #6b4fa3; --s-sent-bg: #ece6f6;
  --s-quote: #22707a; --s-quote-bg: #dcefee; --s-won: #2e7d4f; --s-won-bg: #dcf0e3; --s-lost: #8d4a4a; --s-lost-bg: #f3e1e1;
  --danger: #b23a3a; --shadow: 0 1px 2px rgba(20,30,35,.06), 0 8px 24px rgba(20,30,35,.08);
  --f-display: "Gloock", Georgia, serif; --f-body: "Public Sans", "Segoe UI", system-ui, sans-serif; --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11171b; --panel: #182127; --sunk: #141b20; --line: #2b363d; --ink: #e7ebe8; --ink-2: #a7b3b6; --ink-3: #7b878c;
  --green: #6fae95; --green-soft: #1f3a31; --green-ink: #0e1915; --oak: #d1a46c; --oak-soft: #3a2e20;
  --s-new: #8db8ea; --s-new-bg: #1c2d40; --s-call: #e2b46a; --s-call-bg: #3a2d16; --s-sent: #b9a2e6; --s-sent-bg: #2c2440;
  --s-quote: #7fcbd3; --s-quote-bg: #183539; --s-won: #7fd09f; --s-won-bg: #183627; --s-lost: #e09a9a; --s-lost-bg: #3b2222;
  --danger: #ef8a8a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #11171b; --panel: #182127; --sunk: #141b20; --line: #2b363d; --ink: #e7ebe8; --ink-2: #a7b3b6; --ink-3: #7b878c;
  --green: #6fae95; --green-soft: #1f3a31; --green-ink: #0e1915; --oak: #d1a46c; --oak-soft: #3a2e20;
  --s-new: #8db8ea; --s-new-bg: #1c2d40; --s-call: #e2b46a; --s-call-bg: #3a2d16; --s-sent: #b9a2e6; --s-sent-bg: #2c2440;
  --s-quote: #7fcbd3; --s-quote-bg: #183539; --s-won: #7fd09f; --s-won-bg: #183627; --s-lost: #e09a9a; --s-lost-bg: #3b2222;
  --danger: #ef8a8a; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--oak); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--panel); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 6px; }
.brand svg { width: 38px; height: 38px; flex: none; border-radius: 9px; }
.brand b { font: 400 1.25rem/1 var(--f-display); display: block; }
.brand small { font-size: .74rem; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; }
.nav { display: grid; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; padding: 10px 12px; border-radius: 8px; text-align: left; color: var(--ink-2); font-weight: 500; }
.nav button svg { width: 18px; height: 18px; flex: none; }
.nav button:hover { background: var(--sunk); color: var(--ink); }
.nav button[aria-current="page"] { background: var(--green-soft); color: var(--green); font-weight: 600; }
.nav .count { margin-left: auto; font: 500 .75rem var(--f-mono); background: var(--s-new); color: #fff; border-radius: 99px; padding: 1px 7px; }
.rail-foot { margin-top: auto; display: grid; gap: 8px; font-size: .8rem; color: var(--ink-3); padding: 0 6px; }
.rail-foot a { color: var(--ink-2); }

main { min-width: 0; padding: 26px clamp(16px, 3vw, 36px) 90px; padding-left: max(clamp(16px, 3vw, 36px), env(safe-area-inset-left, 0px)); padding-right: max(clamp(16px, 3vw, 36px), env(safe-area-inset-right, 0px)); }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
.head h1 { font: 400 clamp(1.6rem, 3vw, 2.1rem)/1.1 var(--f-display); margin: 0; }
.head p { margin: 4px 0 0; color: var(--ink-2); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px 13px; font-weight: 600; font-size: .9rem; }
.btn:hover { border-color: var(--ink-3); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--green); border-color: var(--green); color: var(--green-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.danger { color: var(--danger); }
.btn[disabled] { opacity: .55; cursor: default; }

.banner { border-radius: 10px; padding: 11px 14px; margin-bottom: 16px; font-size: .9rem; display: flex; gap: 10px; align-items: flex-start; background: var(--oak-soft); color: var(--ink); }
.banner.ok { background: var(--green-soft); }
.banner.err { background: var(--s-lost-bg); }

/* Tableau de bord */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 12px; margin-bottom: 22px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: grid; gap: 4px; }
.kpi span { font-size: .78rem; color: var(--ink-2); letter-spacing: .04em; text-transform: uppercase; }
.kpi b { font: 500 1.7rem/1.1 var(--f-mono); }
.kpi small { color: var(--ink-3); font-size: .8rem; }
.kpi.accent { background: var(--green); color: var(--green-ink); border-color: var(--green); }
.kpi.accent span, .kpi.accent small { color: inherit; opacity: .85; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
.card h2 { font: 600 .95rem var(--f-body); margin: 0 0 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.card h2 small { font-weight: 400; color: var(--ink-3); font-size: .8rem; }
.funnel { display: grid; gap: 9px; }
.frow { display: grid; grid-template-columns: 150px minmax(0, 1fr) 36px; gap: 10px; align-items: center; font-size: .88rem; }
.fbar { height: 12px; background: var(--sunk); border-radius: 6px; overflow: hidden; }
.fbar i { display: block; height: 100%; border-radius: 6px; }
.frow b { font: 500 .9rem var(--f-mono); text-align: right; }
.mini { display: grid; gap: 2px; }
.mini button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; text-align: left; border: 0; background: none; padding: 9px 8px; border-radius: 8px; }
.mini button:hover { background: var(--sunk); }
.mini button > span:first-child { min-width: 0; display: grid; }
.mini .t { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mini .s { display: block; color: var(--ink-2); font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { text-align: center; color: var(--ink-2); padding: 26px 10px; display: grid; gap: 10px; justify-items: center; }
.empty svg { width: 46px; height: 46px; opacity: .5; }
.bars { display: grid; gap: 7px; }
.brow { display: grid; grid-template-columns: 120px minmax(0, 1fr) 28px; gap: 8px; align-items: center; font-size: .85rem; }
.brow .fbar i { background: var(--oak); }

/* Liste */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.search { flex: 1 1 220px; display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; min-width: 0; }
.search input { border: 0; background: none; padding: 9px 0; width: 100%; outline: none; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 99px; padding: 5px 11px; font-size: .82rem; font-weight: 500; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.table { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.row { display: grid; grid-template-columns: 110px minmax(0, 1.3fr) minmax(0, 1.4fr) 110px 120px; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; }
.row:last-child { border-bottom: 0; }
button.row:hover { background: var(--sunk); }
.row.headrow { font-size: .74rem; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; padding-block: 9px; background: var(--sunk); }
.row .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .who small, .row .what small { color: var(--ink-2); font-size: .8rem; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9rem; }
.row .amt { font: 500 .88rem var(--f-mono); text-align: right; }
.date { font: .82rem var(--f-mono); color: var(--ink-2); }
.pill { display: inline-flex; align-items: center; gap: 5px; border-radius: 99px; padding: 3px 9px; font-size: .76rem; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-nouvelle { color: var(--s-new); background: var(--s-new-bg); }
.st-contactee { color: var(--s-call); background: var(--s-call-bg); }
.st-transmise { color: var(--s-sent); background: var(--s-sent-bg); }
.st-devis { color: var(--s-quote); background: var(--s-quote-bg); }
.st-signee { color: var(--s-won); background: var(--s-won-bg); }
.st-perdue { color: var(--s-lost); background: var(--s-lost-bg); }
.zone { font-size: .72rem; font-weight: 600; border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: 1px; }
.zone.in { background: var(--green-soft); color: var(--green); }
.zone.out { background: var(--oak-soft); color: var(--oak); }
.flag { color: var(--danger); font-size: .78rem; font-weight: 600; }

/* Panneau détail */
.scrim { position: fixed; inset: 0; background: rgba(15, 22, 27, .38); z-index: 20; }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100%); background: var(--panel); z-index: 21; box-shadow: var(--shadow); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.sheet header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; padding: 18px 20px 12px; padding-right: max(20px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); }
.sheet header h2 { font: 400 1.5rem/1.15 var(--f-display); margin: 0; }
.sheet header p { margin: 4px 0 0; color: var(--ink-2); font-size: .88rem; }
.sheet .body { overflow-y: auto; padding: 16px 20px 28px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; align-content: start; }
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.steps button { border: 0; background: var(--sunk); padding: 8px 4px 7px; font-size: .72rem; font-weight: 600; color: var(--ink-3); border-radius: 6px; line-height: 1.2; }
.steps button.done { background: var(--green-soft); color: var(--green); }
.steps button.cur { background: var(--green); color: var(--green-ink); }
.lostline { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .85rem; }
.sec h3 { font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin: 0 0 8px; font-weight: 600; }
.kv { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 6px 12px; font-size: .92rem; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.copyable { display: inline-flex; gap: 6px; align-items: center; }
.copyable button { border: 0; background: var(--sunk); border-radius: 5px; font-size: .72rem; padding: 2px 7px; color: var(--ink-2); }
.tags { display: flex; gap: 5px; flex-wrap: wrap; }
.tag { background: var(--oak-soft); color: var(--ink); border-radius: 5px; padding: 2px 8px; font-size: .82rem; font-weight: 500; }
.quote { background: var(--sunk); border-radius: 8px; padding: 10px 12px; font-size: .9rem; white-space: pre-wrap; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 10px; }
label.f { display: grid; gap: 4px; font-size: .8rem; font-weight: 600; color: var(--ink-2); }
.f input, .f select, .f textarea, .inp { border: 1px solid var(--line); background: var(--sunk); border-radius: 7px; padding: 8px 10px; width: 100%; font-weight: 400; color: var(--ink); }
.f textarea { min-height: 70px; resize: vertical; }
.money { display: flex; justify-content: space-between; align-items: baseline; background: var(--green-soft); border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
.money b { font: 500 1.15rem var(--f-mono); color: var(--green); }
.log { display: grid; gap: 8px; }
.log div { border-left: 2px solid var(--line); padding-left: 10px; font-size: .88rem; }
.log time { display: block; font: .74rem var(--f-mono); color: var(--ink-3); }
.addnote { display: flex; gap: 8px; }
.addnote input { flex: 1; min-width: 0; }
.sheet footer { border-top: 1px solid var(--line); padding: 12px 20px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; }

/* Formulaire nouvelle demande + réglages */
.form-card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: grid; gap: 14px; max-width: 760px; }
.pchips { display: flex; flex-wrap: wrap; gap: 6px; }
.pchips label { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 99px; padding: 5px 11px; font-size: .85rem; background: var(--sunk); cursor: pointer; }
.pchips label:has(input:checked) { border-color: var(--green); background: var(--green-soft); color: var(--green); font-weight: 600; }
.pchips input { accent-color: var(--green); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--panel); padding: 10px 16px; border-radius: 9px; font-size: .9rem; z-index: 40; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
.spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp .8s linear infinite; display: inline-block; }
@keyframes sp { to { transform: rotate(360deg); } }

@media (max-width: 880px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; z-index: 15; flex-direction: row; padding: 6px max(10px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-right, 0px)); border-right: 0; border-top: 1px solid var(--line); gap: 0; }
  .rail .brand, .rail-foot { display: none; }
  .nav { grid-auto-flow: column; grid-auto-columns: 1fr; width: 100%; }
  .nav button { flex-direction: column; gap: 3px; font-size: .7rem; padding: 6px 2px; position: relative; justify-content: center; text-align: center; }
  .nav .count { position: absolute; top: 2px; left: 55%; margin: 0; font-size: .64rem; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
  .row { grid-template-columns: minmax(0, 1fr) auto; }
  .row .what, .row .amt, .row.headrow { display: none; }
  .row .date { grid-column: 1 / -1; order: 3; }
  .frow { grid-template-columns: 110px minmax(0, 1fr) 30px; }
  .mobile-brand { display: flex !important; }
}
.mobile-brand { display: none; align-items: center; gap: 9px; margin-bottom: 14px; }
.mobile-brand svg { width: 30px; height: 30px; border-radius: 7px; }
.mobile-brand b { font: 400 1.1rem var(--f-display); }
.mlist { display: grid; }
.mrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; padding: 14px 16px; border-bottom: 1px solid var(--line); align-items: start; }
.mrow:last-child { border-bottom: 0; }
.mrow.done { opacity: .62; }
.mrow .mhead { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; min-width: 0; }
.mrow .mfrom { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.mrow .mdate { color: var(--ink-3); font-size: .8rem; font-family: var(--f-mono); }
.mrow .msubj { font-size: .92rem; margin-top: 2px; overflow-wrap: anywhere; }
.mrow .msnip { color: var(--ink-2); font-size: .84rem; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.mrow .mact { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.mrow .mact .btn { padding: 6px 11px; font-size: .82rem; }
.badge { display: inline-block; border-radius: 5px; padding: 1px 7px; font-size: .72rem; font-weight: 600; background: var(--sunk); color: var(--ink-2); border: 1px solid var(--line); }
.badge.hot { background: var(--oak-soft); color: var(--ink); border-color: transparent; }
@media (max-width: 880px) { .mrow { grid-template-columns: minmax(0, 1fr); } .mrow .mact { justify-content: flex-start; } }
</style>

  <symbol id="i-door" viewBox="0 0 24 24"><path d="M6 21V5a6 6 0 0 1 12 0v16M3 21h18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>

<script>
(function () {
  "use strict";
  var CP = __CP__;
  var PRODUITS = ["Fenêtres", "Volets", "Porte d'entrée", "Porte de garage", "Portail", "Pergola", "Portes intérieures"];
  var STATUTS = [
    { id: "nouvelle", label: "Nouvelle", short: "Nouvelle" },
    { id: "contactee", label: "Client rappelé", short: "Rappelé" },
    { id: "transmise", label: "Transmise à Clément", short: "Transmise" },
    { id: "devis", label: "Devis remis", short: "Devis" },
    { id: "signee", label: "Signée", short: "Signée" },
    { id: "perdue", label: "Perdue", short: "Perdue" }
  ];
  var ST = {}; STATUTS.forEach(function (s, i) { ST[s.id] = Object.assign({ i: i }, s); });
  var GMAIL_QUERY = 'subject:("Nouvelle demande Seuil Normand") newer_than:365d';
  var CONTACT = "contact@seuilnormand.fr";
  var SRC_SHORT = { site: "Site", email: "Email", messenger: "Messenger", instagram: "Instagram", whatsapp: "WhatsApp", telephone: "Téléphone" };
  var SRC = { site: "formulaire du site", email: "reçue par email", messenger: "reçue sur Messenger", instagram: "reçue sur Instagram", whatsapp: "reçue sur WhatsApp", telephone: "reçue par téléphone", manuel: "saisie manuelle" };
  var MAIL_QUERIES = {
    sn: '(to:' + CONTACT + ' OR deliveredto:' + CONTACT + ' OR cc:' + CONTACT + ' OR subject:("Nouvelle demande Seuil Normand") OR "seuil normand" OR seuilnormand) -in:sent newer_than:90d',
    all: "in:inbox newer_than:14d"
  };

  var state = { view: "dash", demandes: [], loaded: false, settings: { emailClement: "clement.dubos@materiauxdubos.com", taux: "" }, filter: "actives", q: "", openId: null, dbOk: null, syncing: false,
    mail: { filter: "sn", threads: { sn: null, all: null }, loading: false, err: "", busy: {} }, tri: {} };
  var db = null, mcp = null;

  /* ---------- utilitaires ---------- */
  function $(s, r) { return (r || document).querySelector(s); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function eur(n) { if (n == null || n === "" || isNaN(n)) return "—"; return Number(n).toLocaleString("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 }); }
  function fdate(iso, withTime) { if (!iso) return "—"; var d = new Date(iso); if (isNaN(d)) return "—"; var o = { day: "2-digit", month: "short" }; if (d.getFullYear() !== new Date().getFullYear()) o.year = "numeric"; if (withTime) { o.hour = "2-digit"; o.minute = "2-digit"; } return d.toLocaleDateString("fr-FR", o); }
  function ago(iso) { var d = (Date.now() - new Date(iso)) / 86400000; if (d < 1) return "aujourd'hui"; if (d < 2) return "hier"; return "il y a " + Math.floor(d) + " j"; }
  function toast(t) { var h = $("#toastHost"); h.innerHTML = '<div class="toast" role="status">' + esc(t) + "</div>"; clearTimeout(toast._t); toast._t = setTimeout(function () { h.innerHTML = ""; }, 3200); }
  function distOf(cp) { var k = CP[cp]; return k === undefined ? null : k; }
  function commissionOf(d) {
    if (d.commission !== undefined && d.commission !== null && d.commission !== "") return Number(d.commission);
    var t = parseFloat(String(state.settings.taux).replace(",", "."));
    if (!isNaN(t) && d.montantDevis) return Math.round(d.montantDevis * t) / 100;
    return null;
  }
  function needsAttention(d) {
    if (d.statut === "nouvelle" && (Date.now() - new Date(d.createdAt)) > 2 * 86400000) return "À rappeler";
    if (d.relance && d.statut !== "signee" && d.statut !== "perdue" && new Date(d.relance) <= new Date()) return "Relance prévue";
    return "";
  }
  function copy(text, btn) {
    try { navigator.clipboard.writeText(text).then(function () { toast("Copié"); }, function () { sel(btn); }); } catch (e) { sel(btn); }
    function sel(b) { var r = document.createRange(); r.selectNodeContents(b.previousElementSibling); var s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Texte sélectionné : copiez-le"); }
  }

  /* ---------- données ---------- */
  function col() { return db.collection("demandes"); }
  function save(id, patch) {
    if (!db) { toast("Enregistrement indisponible ici"); return Promise.reject(); }
    patch.updatedAt = new Date().toISOString();
    return col().doc(id).update(patch).catch(function (e) { toast(e && e.code === "quota_exceeded" ? "Stockage plein : supprimez d'anciennes demandes" : "Échec de l'enregistrement, réessayez"); throw e; });
  }
  function addLog(d, text) { var log = (d.journal || []).slice(); log.unshift({ at: new Date().toISOString(), text: text }); return log; }

  /* ---------- import Gmail ---------- */
  function parseBody(body) {
    var out = {};
    String(body || "").split(/\n/).forEach(function (line) {
      var m = line.match(/^\|\s*([^|]+?)\s*\|\s*([^|]*?)\s*\|\s*$/);
      if (m && m[1] !== "Name" && !/^-+$/.test(m[1])) out[m[1]] = m[2];
    });
    return out;
  }
  function errText(e) {
    var c = e && e.code;
    if (c === "needs_reauth") return "La connexion Gmail a expiré : reconnectez Gmail dans claude.ai, Paramètres › Connecteurs.";
    if (c === "server_not_connected" || c === "selection_required") return "Gmail n'est pas connecté : ajoutez-le dans claude.ai, Paramètres › Connecteurs.";
    if (c === "not_in_manifest" || c === "approval_required") return "L'accès à Gmail n'a pas été autorisé pour cette application. Cliquez de nouveau sur « Importer depuis Gmail » et acceptez.";
    if (c === "blocked_by_policy") return "Votre organisation bloque l'accès à Gmail depuis cette application.";
    if (c === "server_unavailable" || c === "upstream_error") return "Gmail ne répond pas pour le moment. Réessayez dans un instant.";
    return "L'import Gmail a échoué (" + (c || "erreur inconnue") + ").";
  }
  function syncGmail(manual) {
    if (!mcp || !db || state.syncing) { if (manual && !mcp) toast("Gmail n'est pas disponible dans cette vue"); return; }
    state.syncing = true; render();
    var known = {}; state.demandes.forEach(function (d) { if (d.threadId) known[d.threadId] = 1; });
    var added = 0;
    mcp.callTool("Gmail", "search_threads", { query: GMAIL_QUERY, pageSize: 50 }, { cache: false }).then(function (r) {
      var threads = (r.payload && r.payload.threads) || [];
      var todo = threads.filter(function (t) { return !known[t.id]; });
      return todo.reduce(function (p, t) {
        return p.then(function () {
          return mcp.callTool("Gmail", "get_thread", { threadId: t.id, messageFormat: "PLAIN_TEXT" }, { cache: false }).then(function (g) {
            var p = g.payload || {}; var m = (p.messages || [])[0] || {};
            var f = parseBody(m.plaintextBody || m.plaintext_body);
            if (!f["Code postal"] && !f["Nom"]) return;
            var cp = (f["Code postal"] || "").trim();
            var dist = distOf(cp);
            var doc = {
              source: "site", threadId: t.id, gmailUrl: m.viewUrl || p.viewUrl || t.viewUrl || "",
              createdAt: m.date || new Date().toISOString(), updatedAt: new Date().toISOString(),
              produits: (f["Produits"] || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean),
              projet: f["Projet"] || "", pose: f["Pose"] || "", cp: cp, commune: f["Commune"] || "",
              distanceKm: dist, details: f["Détails"] || "", delai: f["Délai"] || "",
              nom: f["Nom"] || "", tel: f["Téléphone"] || "", email: f["Email"] || "",
              statut: "nouvelle", montantDevis: null, commission: null, relance: "",
              journal: [{ at: new Date().toISOString(), text: "Demande importée depuis le site" }]
            };
            return col().doc("g-" + t.id).set(doc).then(function () { added++; });
          });
        });
      }, Promise.resolve());
    }).then(function () {
      var now = new Date().toISOString();
      try { localStorage.setItem("sn-lastsync", now); } catch (e) {}
      $("#syncInfo").textContent = "Gmail vérifié " + fdate(now, true);
      if (manual || added) toast(added ? added + (added > 1 ? " nouvelles demandes importées" : " nouvelle demande importée") : "Aucune nouvelle demande");
    }).catch(function (e) {
      state.gmailErr = errText(e);
      if (manual) toast(state.gmailErr);
    }).then(function () { state.syncing = false; render(); });
  }

  /* ---------- boîte mail (Gmail + contact@ renvoyé vers Gmail) ---------- */
  function unent(s) { return String(s || "").replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&amp;/g, "&"); }
  function lastMsg(t) { var ms = t.messages || []; return ms[ms.length - 1] || {}; }
  function senderOf(m) {
    var addr = m.sender || "", name = "";
    (m.addressDisplayNames || []).forEach(function (a) { if (a.emailAddress === addr && a.displayName) name = a.displayName; });
    var mm = addr.match(/^\s*"?([^"<]*)"?\s*<([^>]+)>/); if (mm) { name = name || mm[1].trim(); addr = mm[2]; }
    return { name: name, email: addr };
  }
  function toContact(t) { return (t.messages || []).some(function (m) { return [].concat(m.toRecipients || [], m.ccRecipients || []).join(" ").toLowerCase().indexOf(CONTACT) >= 0; }); }
  function isForm(t) { return /Nouvelle demande Seuil Normand/i.test(lastMsg(t).subject || (t.messages || [{}])[0].subject || ""); }
  function knownThreads() { var k = {}; state.demandes.forEach(function (d) { if (d.threadId) k[d.threadId] = d._id; }); return k; }
  function mailState(t, known) {
    if (known[t.id]) return "demande";
    if (isForm(t)) return "form";
    if (state.tri[t.id] === "ignoree") return "ignoree";
    return "atrier";
  }
  function toSortCount() {
    var list = state.mail.threads.sn; if (!list) return 0;
    var k = knownThreads(); return list.filter(function (t) { return mailState(t, k) === "atrier"; }).length;
  }
  function loadMail(which, manual) {
    if (!mcp) { if (manual) toast("Gmail n'est pas disponible dans cette vue"); return Promise.resolve(); }
    which = which || state.mail.filter;
    state.mail.loading = true; state.mail.err = ""; if (state.view === "mail") render();
    return mcp.callTool("Gmail", "search_threads", { query: MAIL_QUERIES[which], pageSize: 40, view: "THREAD_VIEW_SUMMARY" }, { cache: false }).then(function (r) {
      state.mail.threads[which] = (r.payload && r.payload.threads) || [];
      if (manual) toast(state.mail.threads[which].length + " conversation" + (state.mail.threads[which].length > 1 ? "s" : "") + " trouvée" + (state.mail.threads[which].length > 1 ? "s" : ""));
    }).catch(function (e) { state.mail.err = errText(e); }).then(function () { state.mail.loading = false; render(); });
  }
  var PROD_WORDS = [["Fenêtres", /fen[eê]tre|baie|vitr|menuiser/i], ["Volets", /volet/i], ["Porte d'entrée", /porte d.entr/i], ["Porte de garage", /garage/i], ["Portail", /portail|portillon/i], ["Pergola", /pergola|store/i], ["Portes intérieures", /porte.{0,3}int[eé]rieur|portes de chambre/i]];
  function guessProducts(text) { return PROD_WORDS.filter(function (p) { return p[1].test(text); }).map(function (p) { return p[0]; }); }
  function addFromMail(t, btn) {
    if (!db || !mcp) return toast("Enregistrement indisponible ici");
    state.mail.busy[t.id] = 1; render();
    mcp.callTool("Gmail", "get_thread", { threadId: t.id, messageFormat: "PLAIN_TEXT" }, { cache: false }).then(function (g) {
      var p = g.payload || {}, ms = p.messages || [], first = ms[0] || {}, s = senderOf(first);
      var body = unent(first.plaintextBody || first.plaintext_body || first.snippet || "").trim();
      var txt = (first.subject || "") + "\n" + body;
      var tel = (body.match(/(?:\+33\s?|0)[1-9](?:[\s.-]?\d{2}){4}/) || [""])[0];
      var cp = (body.match(/\b(27|14|76|61|78|95|28)\d{3}\b/) || [""])[0];
      var now = new Date().toISOString();
      var doc = {
        source: "email", threadId: t.id, gmailUrl: t.viewUrl || first.viewUrl || "",
        createdAt: first.date || now, updatedAt: now, produits: guessProducts(txt),
        projet: "", pose: "", cp: cp, commune: "", distanceKm: cp ? distOf(cp) : null,
        details: ((first.subject ? "Objet : " + first.subject + "\n\n" : "") + body).slice(0, 2500), delai: "",
        nom: s.name || s.email, tel: tel, email: s.email,
        statut: "nouvelle", montantDevis: null, commission: null, relance: "",
        journal: [{ at: now, text: "Demande créée depuis un email" + (toContact(t) ? " reçu sur " + CONTACT : "") }]
      };
      return col().doc("g-" + t.id).set(doc).then(function () {
        return db.doc("tri/" + t.id).set({ etat: "ajoutee", at: now }).catch(function () {});
      }).then(function () { toast("Ajoutée aux demandes"); state.view = "list"; state.openId = "g-" + t.id; });
    }).catch(function (e) { toast(e && e.code ? errText(e) : "Échec, réessayez"); }).then(function () { delete state.mail.busy[t.id]; render(); });
  }
  function setTri(id, etat) {
    if (!db) return toast("Enregistrement indisponible ici");
    state.tri[id] = etat; render();
    var ref = db.doc("tri/" + id);
    (etat ? ref.set({ etat: etat, at: new Date().toISOString() }) : ref.delete()).catch(function () { toast("Échec de l'enregistrement"); });
  }

  /* ---------- brouillon pour Clément ---------- */
  function draftToClement(d, btn) {
    if (!mcp) { toast("Gmail n'est pas disponible dans cette vue"); return; }
    var to = (state.settings.emailClement || "").trim();
    if (!to) { toast("Renseignez l'email de Clément dans Réglages"); return; }
    btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Création…';
    var lines = [
      "Salut Clément,", "", "Nouvelle demande de devis à chiffrer :", "",
      "Client : " + (d.nom || "—"), "Téléphone : " + (d.tel || "—"), "Email : " + (d.email || "—"),
      "Commune : " + [d.cp, d.commune].filter(Boolean).join(" ") + (d.distanceKm != null ? " (≈ " + d.distanceKm + " km des magasins)" : ""),
      "", "Produits : " + (d.produits || []).join(", "), "Projet : " + (d.projet || "—") + " · " + (d.pose || "—"),
      "Délai souhaité : " + (d.delai || "—"), "", "Détails du client :", d.details || "—", "",
      "Je te laisse me dire quand le devis est prêt.", "", "Victor"
    ];
    mcp.callTool("Gmail", "create_draft", { to: [to], subject: "Devis à chiffrer – " + (d.produits || []).join(", ") + " – " + (d.commune || d.cp || ""), body: lines.join("\n") }).then(function (r) {
      var url = r.payload && r.payload.viewUrl;
      var patch = { journal: addLog(d, "Brouillon d'email pour Clément créé dans Gmail") };
      if (ST[d.statut].i < ST.transmise.i) patch.statut = "transmise";
      save(d._id, patch);
      toast("Brouillon créé dans Gmail : relisez-le puis envoyez");
      if (url) { var a = $("#draftLink"); if (a) { a.href = url; a.hidden = false; } }
    }).catch(function (e) {
      toast(e && e.code === "tool_error" ? "Gmail a refusé le brouillon : vérifiez l'email de Clément" : errText(e) + " Le brouillon a peut-être été créé : vérifiez vos brouillons Gmail.");
    }).then(function () { btn.disabled = false; btn.innerHTML = '<svg><use href="#i-send"/></svg>Préparer l\'email à Clément'; });
  }

  /* ---------- vues ---------- */
  function counts() {
    var c = {}; STATUTS.forEach(function (s) { c[s.id] = 0; });
    state.demandes.forEach(function (d) { c[d.statut] = (c[d.statut] || 0) + 1; });
    return c;
  }
  function mobileBrand() { return '<div class="mobile-brand"><svg aria-hidden="true"><use href="#logo"/></svg><b>Seuil Normand</b></div>'; }
  function banners() {
    var h = "";
    if (state.dbOk === false) h += '<div class="banner err">L\'enregistrement n\'est pas disponible dans cette vue. Ouvrez l\'application depuis claude.ai, connecté à votre compte.</div>';
    if (state.gmailErr) h += '<div class="banner">' + esc(state.gmailErr) + "</div>";
    return h;
  }
  function syncBtn() {
    return '<button class="btn" id="syncBtn"' + (state.syncing ? " disabled" : "") + ">" + (state.syncing ? '<span class="spin"></span> Import en cours…' : '<svg><use href="#i-sync"/></svg>Importer depuis Gmail') + "</button>";
  }

  function viewDash() {
    var c = counts(), all = state.demandes;
    var actives = all.filter(function (d) { return d.statut !== "signee" && d.statut !== "perdue"; });
    var signees = all.filter(function (d) { return d.statut === "signee"; });
    var ca = signees.reduce(function (s, d) { return s + (Number(d.montantDevis) || 0); }, 0);
    var com = signees.reduce(function (s, d) { var x = commissionOf(d); return s + (x || 0); }, 0);
    var pipe = actives.reduce(function (s, d) { return s + (Number(d.montantDevis) || 0); }, 0);
    var closed = signees.length + c.perdue;
    var rate = closed ? Math.round(signees.length / closed * 100) + " %" : "—";
    var todo = all.filter(function (d) { return needsAttention(d); }).slice(0, 6);
    var recent = all.slice(0, 6);
    var max = Math.max(1, all.length);
    var prod = {}; all.forEach(function (d) { (d.produits || []).forEach(function (p) { prod[p] = (prod[p] || 0) + 1; }); });
    var pmax = Math.max(1, Math.max.apply(null, [0].concat(Object.keys(prod).map(function (k) { return prod[k]; }))));
    var colors = { nouvelle: "var(--s-new)", contactee: "var(--s-call)", transmise: "var(--s-sent)", devis: "var(--s-quote)", signee: "var(--s-won)", perdue: "var(--s-lost)" };

    var h = mobileBrand() + banners() + '<div class="head"><div><h1>Tableau de bord</h1><p>' + (all.length ? all.length + " demande" + (all.length > 1 ? "s" : "") + " au total" : "Vos demandes de devis arriveront ici") + '</p></div><div class="actions">' + syncBtn() + '<button class="btn primary" data-go="new"><svg><use href="#i-plus"/></svg>Ajouter une demande</button></div></div>';
    h += '<div class="kpis">' +
      '<div class="kpi"><span>Nouvelles</span><b>' + c.nouvelle + '</b><small>à rappeler</small></div>' +
      '<div class="kpi"><span>En cours</span><b>' + actives.length + '</b><small>' + eur(pipe) + " de devis en jeu</small></div>" +

      var cp = $("#n-cp").value.trim(), now = new Date().toISOString();
      var src = $("#n-source").value;
      col().add({ source: src, threadId: "", gmailUrl: "", createdAt: now, updatedAt: now, produits: prods, projet: $("#n-projet").value, pose: $("#n-pose").value, cp: cp, commune: $("#n-commune").value.trim(), distanceKm: distOf(cp), details: $("#n-details").value.trim(), delai: $("#n-delai").value, nom: nom, tel: $("#n-tel").value.trim(), email: $("#n-email").value.trim(), statut: "nouvelle", montantDevis: null, commission: null, relance: "", journal: [{ at: now, text: "Demande saisie manuellement (" + (SRC[src] || "autre") + ")" }] })
        .then(function (ref) { toast("Demande enregistrée"); state.view = "list"; state.openId = ref.id; render(); }, function () { toast("Échec de l'enregistrement, réessayez"); });
    }
    if (e.target.id === "setForm") {
      var s = { emailClement: $("#s-email").value.trim(), taux: $("#s-taux").value.trim().replace(",", ".") };
      if (!db) return toast("Enregistrement indisponible ici");
      db.doc("config/reglages").set(s).then(function () { toast("Réglages enregistrés"); }, function () { toast("Échec de l'enregistrement"); });
    }
  });

  /* ---------- démarrage ---------- */
  try { var ls = localStorage.getItem("sn-lastsync"); if (ls) $("#syncInfo").textContent = "Gmail vérifié " + fdate(ls, true); } catch (e) {}
  render();
  var use = window.claude && window.claude.use;
  if (!use) { state.dbOk = false; render(); return; }
  use("db").then(function (d) {
    if (!d) { state.dbOk = false; render(); return; }
    db = d; state.dbOk = true;
    db.collection("tri").onSnapshot(function (s) { var o = {}; s.docs.forEach(function (x) { var v = x.data() || {}; if (v.etat) o[x.id] = v.etat; }); state.tri = o; render(); }, function () {});
    db.doc("config/reglages").onSnapshot(function (s) { var v = s.data(); if (v) { state.settings = Object.assign({}, state.settings, v); render(); } }, function () {});
    col().orderBy("createdAt", "desc").onSnapshot(function (s) {
      state.demandes = s.docs.map(function (x) { var v = Object.assign({ _id: x.id }, x.data()); if (!ST[v.statut]) v.statut = "nouvelle"; return v; });
      var first = !state.loaded; state.loaded = true; render();
      if (first && mcp) syncGmail(false);
    }, function (err) { state.dbOk = false; state.loaded = true; render(); });
  });
  use("mcp").then(function (m) { mcp = m; if (m && state.loaded) syncGmail(false); if (m) loadMail("sn"); });
})();
</script>

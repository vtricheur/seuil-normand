<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Kit Meta – Seuil Normand</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Public+Sans:wght@400;600;700&display=swap">
<style>
  body { margin: 0; background: #11171b; color: #e7ebe8; font: 15px/1.5 "Public Sans", system-ui, sans-serif; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  figure { margin: 0; } figure img, figure video { width: 100%; border-radius: 6px; display: block; }
  figcaption { font-size: .75rem; color: #a7b3b6; }
</style>
</head>
<body>
<p id="s">Préparation…</p>
<div class="grid" id="g"></div>
<script>
/* Génère les visuels (photos 4:5 et 9:16) et les vidéos 9:16 des pubs Meta,
   puis les envoie à la page parente (Gestionnaire de publicités) par postMessage. */
(async function () {
  var LOGO = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="#2e5a4c"/><path d="M20 50V27a12 12 0 0 1 24 0v23" fill="none" stroke="#fbfbf9" stroke-width="4.5" stroke-linecap="round"/><path d="M27 50V29a5 5 0 0 1 10 0v21" fill="#fbfbf9" opacity=".22"/><rect x="12" y="49" width="40" height="5" rx="2.5" fill="#d1a46c"/></svg>';
  var U = "https://images.unsplash.com/";
  var P = {
    fenetres: { tag: "Fenêtres", post: "photo-1774199679021-db3b421867c3", story: "photo-1748063578185-3d68121b11ff", h: "Plus de lumière. Moins de chauffage.", sub: "Fenêtres et baies vitrées sur mesure. TVA à 5,5 % possible.", vsub: "Fenêtres et baies vitrées sur mesure.", hs: 96, vs: 110 },
    entree: { tag: "Porte d'entrée", post: "photo-1628744448840-55bdb2497bd4", story: "photo-1668911494256-becf9fea265b", h: "Une entrée qui donne le ton.", sub: "Portes d'entrée alu, acier ou bois. Serrure 5 points.", vsub: "Portes d'entrée isolantes et sécurisées.", hs: 96, vs: 110 },
    garage: { tag: "Porte de garage", post: "photo-1775430766327-ca7d9f93f563", story: "photo-1770756051811-1612ac8bedfa", h: "La porte de garage qu'on remarque depuis la rue.", vh: "Rentrez sans sortir de la voiture.", sub: "Sectionnelle motorisée, sur mesure, fabrication française.", vsub: "Porte de garage motorisée, posée chez vous.", hs: 88, vs: 110 },
    portail: { tag: "Portail", post: "photo-1780377816572-e48c80e9e3cd", story: "photo-1636466248026-eed6e6777f23", h: "Un portail à la hauteur de votre maison.", sub: "Portails alu battants ou coulissants, motorisables.", vsub: "Sur mesure, motorisable.", hs: 90, vs: 104 },
    pergola: { tag: "Pergola", post: "photo-1696846912973-3233cc80bf86", story: "photo-1696846912293-9a8013e17403", h: "Votre terrasse, de mars à octobre.", sub: "Pergola bioclimatique sur mesure, lames orientables motorisées.", vsub: "Pergola bioclimatique sur mesure.", hs: 96, vs: 110 }
  };
  var qs = new URLSearchParams(location.search);
  var want = (qs.get("p") || Object.keys(P).join(",")).split(",");
  var kinds = (qs.get("k") || "post,story,video").split(",");
  var st = document.getElementById("s"), grid = document.getElementById("g");
  function loadImg(src) { return new Promise(function (res, rej) { var i = new Image(); i.crossOrigin = "anonymous"; i.onload = function () { res(i); }; i.onerror = rej; i.src = src; }); }
  function wrap(x, t, w) { var ws = t.split(" "), ls = [], l = ""; ws.forEach(function (word) { var c = l ? l + " " + word : word; if (x.measureText(c).width > w && l) { ls.push(l); l = word; } else l = c; }); ls.push(l); return ls; }
  var logo = await loadImg("data:image/svg+xml," + encodeURIComponent(LOGO));
  await document.fonts.load("400 80px Gloock"); await document.fonts.load("700 40px 'Public Sans'"); await document.fonts.load("600 40px 'Public Sans'"); await document.fonts.load("400 40px 'Public Sans'");

  /* Dessine une image ; a = opacités {h, sub, cta} entre 0 et 1, z = zoom */
  function draw(x, img, W, H, s, story, h, sub, hs, a, z) {
    z = z || 1; var iw = W * z, ih = H * z; x.drawImage(img, (W - iw) / 2, (H - ih) / 2, iw, ih);
    var g = x.createLinearGradient(0, H * .38, 0, H); g.addColorStop(0, "rgba(15,22,27,0)"); g.addColorStop(.55, "rgba(15,22,27,.72)"); g.addColorStop(1, "rgba(15,22,27,.92)"); x.fillStyle = g; x.fillRect(0, 0, W, H);
    var g2 = x.createLinearGradient(0, 0, 0, 260); g2.addColorStop(0, "rgba(15,22,27,.45)"); g2.addColorStop(1, "rgba(15,22,27,0)"); x.fillStyle = g2; x.fillRect(0, 0, W, 260);
    var top = story ? 140 : 64; x.globalAlpha = 1;
    x.drawImage(logo, 64, top, 76, 76); x.fillStyle = "#fff"; x.font = "400 46px Gloock"; x.textBaseline = "middle"; x.textAlign = "left"; x.fillText("Seuil Normand", 158, top + 40);
    x.font = "600 26px 'Public Sans'"; x.fillStyle = "rgba(255,255,255,.85)"; x.textAlign = "right"; x.fillText(s.tag.toUpperCase(), W - 64, top + 40); x.textAlign = "left";
    var bp = story ? 300 : 90; x.font = "400 " + hs + "px Gloock"; var lines = wrap(x, h, W - 128), lh = hs * 1.05;
    x.font = "400 38px 'Public Sans'"; var sl = wrap(x, sub, W - 128);
    var y = H - bp - 110 - sl.length * 52 - 30 - lines.length * lh;
    x.textBaseline = "alphabetic";
    x.globalAlpha = a.h; x.fillStyle = "#fff"; x.font = "400 " + hs + "px Gloock"; lines.forEach(function (l, i) { x.fillText(l, 64 - (1 - a.h) * 40, y + lh * (i + 1) - lh * .2); }); y += lines.length * lh + 30;
    x.globalAlpha = a.sub; x.font = "400 38px 'Public Sans'"; x.fillStyle = "rgba(255,255,255,.9)"; sl.forEach(function (l, i) { x.fillText(l, 64, y + 52 * (i + 1) - 12); }); y += sl.length * 52 + 40;
    x.globalAlpha = a.cta; x.font = "700 36px 'Public Sans'"; var cta = "Devis gratuit  →  seuilnormand.fr", cw = x.measureText(cta).width + 80;
    x.fillStyle = "#d1a46c"; x.beginPath(); x.roundRect ? x.roundRect(64, y, cw, 84, 42) : x.rect(64, y, cw, 84); x.fill(); x.fillStyle = "#1f2b33"; x.textBaseline = "middle"; x.fillText(cta, 104, y + 43);
    x.globalAlpha = 1;
  }
  function blob(c, t, q) { return new Promise(function (r) { c.toBlob(r, t, q); }); }
  var out = [];
  function show(b, name, isVid) {
    var f = document.createElement("figure"), u = URL.createObjectURL(b);
    f.innerHTML = (isVid ? '<video muted loop autoplay playsinline src="' + u + '"></video>' : '<img alt="" src="' + u + '">') + '<figcaption>' + name + '</figcaption>'; grid.appendChild(f);
  }
  async function photo(k, s, story) {
    var W = 1080, H = story ? 1920 : 1350, c = document.createElement("canvas"); c.width = W; c.height = H; var x = c.getContext("2d");
    var img = await loadImg(U + (story ? s.story : s.post) + "?auto=format&fit=crop&w=" + W + "&h=" + H + "&q=90");
    draw(x, img, W, H, s, story, story && s.vh ? s.vh : s.h, story ? s.vsub : s.sub, story ? s.vs : s.hs, { h: 1, sub: 1, cta: 1 }, 1);
    var b = await blob(c, "image/jpeg", .9), n = "seuil-normand-" + k + (story ? "-story" : "-post") + ".jpg"; out.push({ name: n, type: "image/jpeg", buf: await b.arrayBuffer() }); show(b, n);
  }
  function mime() { var m = ["video/mp4;codecs=avc1.42E01F", "video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm"]; for (var i = 0; i < m.length; i++) if (window.MediaRecorder && MediaRecorder.isTypeSupported(m[i])) return m[i]; return ""; }
  async function video(k, s) {
    var W = 1080, H = 1920, D = 10, c = document.createElement("canvas"); c.width = W; c.height = H; var x = c.getContext("2d");
    var img = await loadImg(U + s.story + "?auto=format&fit=crop&w=" + W + "&h=" + H + "&q=90");
    var mt = mime(); if (!mt) throw new Error("MediaRecorder indisponible");
    var stream = c.captureStream(30), rec = new MediaRecorder(stream, { mimeType: mt, videoBitsPerSecond: 6e6 }), chunks = [];
    rec.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
    var done = new Promise(function (r) { rec.onstop = r; });
    var ease = function (v) { v = Math.max(0, Math.min(1, v)); return 1 - Math.pow(1 - v, 3); };
    var t0 = performance.now(); rec.start(250);
    await new Promise(function (resolve) {
      (function frame() {
        var t = (performance.now() - t0) / 1000;
        x.fillStyle = "#11171b"; x.fillRect(0, 0, W, H);
        draw(x, img, W, H, s, true, s.vh || s.h, s.vsub, s.vs, { h: ease((t - .4) / .8), sub: ease((t - 1.8) / .8), cta: ease((t - 3.2) / .8) }, 1.14 - .14 * Math.min(1, t / D));
        if (t > 7.6) { /* carte de fin */
          var a = ease((t - 7.6) / .6); x.globalAlpha = a * .94; x.fillStyle = "#1f2b33"; x.fillRect(0, 0, W, H); x.globalAlpha = a;
          x.drawImage(logo, W / 2 - 80, 640, 160, 160); x.fillStyle = "#fff"; x.textAlign = "center"; x.textBaseline = "alphabetic";
          x.font = "400 92px Gloock"; x.fillText("Seuil Normand", W / 2, 930);
          x.font = "400 40px 'Public Sans'"; x.fillStyle = "rgba(255,255,255,.85)"; x.fillText("Menuiserie dans l'Eure · Le Neubourg", W / 2, 1010);
          x.font = "700 44px 'Public Sans'"; var cta = "Devis gratuit en 2 minutes", cw = x.measureText(cta).width + 100;
          x.fillStyle = "#d1a46c"; x.beginPath(); x.roundRect ? x.roundRect(W / 2 - cw / 2, 1080, cw, 100, 50) : x.rect(W / 2 - cw / 2, 1080, cw, 100); x.fill();
          x.fillStyle = "#1f2b33"; x.textBaseline = "middle"; x.fillText(cta, W / 2, 1131);
          x.fillStyle = "#fff"; x.font = "600 40px 'Public Sans'"; x.textBaseline = "alphabetic"; x.fillText("seuilnormand.fr", W / 2, 1270);
          x.textAlign = "left"; x.globalAlpha = 1;
        }
        if (t < D) requestAnimationFrame(frame); else resolve();
      })();
    });
    rec.stop(); await done;
    var ext = mt.indexOf("mp4") >= 0 ? "mp4" : "webm", b = new Blob(chunks, { type: mt.split(";")[0] }), n = "seuil-normand-" + k + "-video." + ext;
    out.push({ name: n, type: b.type, buf: await b.arrayBuffer() }); show(b, n, true);
  }
  var list = [];
  want.forEach(function (k) { if (!P[k]) return; kinds.forEach(function (kd) { list.push([k, kd]); }); });
  for (var i = 0; i < list.length; i++) {
    var k = list[i][0], kd = list[i][1], s = P[k];
    st.textContent = "Création " + (i + 1) + " / " + list.length + " : " + s.tag + " (" + kd + ")…";
    try { if (kd === "video") await video(k, s); else await photo(k, s, kd === "story"); }
    catch (e) { st.textContent = "Erreur sur " + k + " " + kd + " : " + e.message; }
  }
  st.textContent = out.length + " fichiers prêts (" + mime() + ").";
  window.SN_OUT = out;
  var T = window.opener || (window.parent !== window ? window.parent : null);
  if (T) T.postMessage({ snkit: out }, "*");
})();
</script>
</body>
</html>
